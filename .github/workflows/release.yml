name: Release

# Every push to main that changes code publishes the next patch version (v0.2.0, v0.2.1, ...)
# with plain, static binaries for Linux and macOS. Docs-only pushes don't release.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "skills/**", "LICENSE", ".gitignore", ".gitattributes"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Linux and macOS binaries
    runs-on: ubuntu-latest # GitHub's Linux build machine; the binaries run on any Linux
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags, to work out the next version
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Next version
        id: version
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then
            next=v0.2.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            export GOOS=${target%/*} GOARCH=${target#*/}
            for cmd in moodle moodle-mcp; do
              go build -trimpath -ldflags="-s -w" -o "dist/${cmd}_${GOOS}_${GOARCH}" "./cmd/$cmd"
            done
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" dist/* --target "$GITHUB_SHA" --generate-notes
